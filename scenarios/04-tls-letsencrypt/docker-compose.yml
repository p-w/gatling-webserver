# Szenario 4: TLS mit Let's Encrypt, Caddy terminiert vor gatling
#
# Caddy holt und erneuert das Zertifikat selbst (HTTP-01 oder TLS-ALPN-01)
# und leitet HTTP auf HTTPS um. gatling bekommt nur Klartext-HTTP aus dem
# internen Netz und veroeffentlicht keinen Host-Port.
#
# Voraussetzungen: oeffentliche Domain mit A/AAAA-Record auf diesen Host,
# Ports 80 und 443 von aussen erreichbar.
#
#   cp .env.example .env      # DOMAIN und ACME_EMAIL setzen
#   docker compose up -d --build
#   docker compose logs -f caddy      # "certificate obtained successfully"
#   sh test.sh
#
# Zum Ausprobieren erst mit der Staging-CA (ACME_CA in .env), sie hat keine
# Ratenbegrenzung. Fuer den Wechsel auf die echte CA: ACME_CA entfernen,
# "docker compose down -v" (loescht die Staging-Zertifikate), neu starten.
#
# Ausfuehrliche Anleitung: ../../docs/lets-encrypt.md

services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN in .env setzen}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL in .env setzen}
      ACME_CA: ${ACME_CA:-https://acme-v02.api.letsencrypt.org/directory}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - gatling
    networks:
      - internal
    restart: unless-stopped

  gatling:
    build:
      context: ../..
    image: wilfahrt/gatling-webserver:dev
    environment:
      GATLING_OPTIONS: "-F -S -V -D"
    volumes:
      - ./www:/var/www:ro
    networks:
      - internal
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - SYS_CHROOT
      - SETUID
      - SETGID
    restart: unless-stopped

networks:
  internal:

volumes:
  caddy-data:
  caddy-config:
